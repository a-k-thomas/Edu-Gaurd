services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dropout_postgres
    environment:
      POSTGRES_USER: dropout_user
      POSTGRES_PASSWORD: dropout_pass
      POSTGRES_DB: dropout_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dropout_network

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: dropout_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dropout_network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dropout_backend
    environment:
      DATABASE_URL: postgresql://dropout_user:dropout_pass@postgres:5432/dropout_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - dropout_network

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dropout_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
    command: npm run dev
    networks:
      - dropout_network

  # Celery Worker (for alerts)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dropout_celery_worker
    environment:
      DATABASE_URL: postgresql://dropout_user:dropout_pass@postgres:5432/dropout_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app
    command: celery -A app.tasks worker --loglevel=info
    networks:
      - dropout_network

volumes:
  postgres_data:
  redis_data:

networks:
  dropout_network:
    driver: bridge
